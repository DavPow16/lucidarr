# Fork-only CI: runs upstream's suite AND ours. (Upstream's own ci.yml keeps running too.)
name: lucidarr CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Editable on purpose: the fork's logo is not packaged into wheels.
      - run: python -m pip install --upgrade pip && pip install -e .
      - run: python selftest.py
      - run: python selftest_lucidarr.py
      - name: Standalone token script starts without lucidadl
        run: python scripts/lucida_token.py --help
